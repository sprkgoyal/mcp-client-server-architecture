<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 17px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 15px Arial, sans-serif; fill: #334155; }
      .flow { font: 600 16px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="title">MCP + Keycloak Reference Architecture</text>
  <text x="600" y="85" text-anchor="middle" class="subtitle">Securing Spring AI MCP client/server with OAuth2 scopes</text>

  <rect x="60" y="160" rx="14" ry="14" width="250" height="150" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="205" text-anchor="middle" class="boxTitle">User / Inspector</text>
  <text x="185" y="235" text-anchor="middle" class="boxText">Requests token</text>
  <text x="185" y="260" text-anchor="middle" class="boxText">Invokes MCP tools</text>

  <rect x="460" y="140" rx="14" ry="14" width="280" height="190" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="185" text-anchor="middle" class="boxTitle">Keycloak</text>
  <text x="600" y="215" text-anchor="middle" class="boxText">Realm: mcp-realm</text>
  <text x="600" y="240" text-anchor="middle" class="boxText">Client: mcp-test</text>
  <text x="600" y="265" text-anchor="middle" class="boxText">Scope: mcp:tools</text>
  <text x="600" y="290" text-anchor="middle" class="small">Issues JWT access tokens</text>

  <rect x="70" y="430" rx="14" ry="14" width="380" height="220" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="475" text-anchor="middle" class="boxTitle">MCP Client (Spring Boot)</text>
  <text x="260" y="505" text-anchor="middle" class="boxText">OAuth2 client enabled</text>
  <text x="260" y="530" text-anchor="middle" class="boxText">Adds Bearer token to MCP request</text>
  <text x="260" y="555" text-anchor="middle" class="small">client/.../SecurityConfiguration.java</text>
  <text x="260" y="578" text-anchor="middle" class="small">client/.../McpConfiguration.java</text>

  <rect x="740" y="430" rx="14" ry="14" width="390" height="220" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="935" y="475" text-anchor="middle" class="boxTitle">MCP Server (Spring Boot)</text>
  <text x="935" y="505" text-anchor="middle" class="boxText">Validates token issuer/claims</text>
  <text x="935" y="530" text-anchor="middle" class="boxText">@PreAuthorize on MCP tools</text>
  <text x="935" y="555" text-anchor="middle" class="small">server/.../McpSecurityConfiguration.java</text>
  <text x="935" y="578" text-anchor="middle" class="small">server/.../McpTools.java</text>

  <line x1="310" y1="215" x2="450" y2="215" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="378" y="200" text-anchor="middle" class="flow">1) Username/password login</text>

  <line x1="600" y1="330" x2="300" y2="430" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="435" y="365" text-anchor="middle" class="flow">2) Access token (scope mcp:tools)</text>

  <line x1="450" y1="530" x2="730" y2="530" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="590" y="515" text-anchor="middle" class="flow">3) POST /mcp + Bearer token</text>

  <line x1="740" y1="600" x2="450" y2="600" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="595" y="585" text-anchor="middle" class="flow">4) Tool result / Access Denied</text>

  <text x="600" y="710" text-anchor="middle" class="subtitle">Principle: Keycloak issues identity + scopes, MCP server enforces least-privilege tool access.</text>
</svg>
