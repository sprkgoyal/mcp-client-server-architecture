spring.application.name=MCP Client

# Server Config
server.port=9091

# MCP Client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.streamable-http.connections.server1.url=http://localhost:9090

# Spring Security
spring.security.oauth2.client.provider.authserver.issuer-uri=http://localhost:8080/realms/mcp-realm
spring.security.oauth2.client.registration.authserver.client-id=mcp-test
spring.security.oauth2.client.registration.authserver.scope=openid,mcp:tools,offline_access
spring.security.oauth2.client.registration.authserver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.authserver.client-authentication-method=none
#spring.security.oauth2.client.registration.authserver.client-secret=<THE CLIENT SECRET>

# logging
logging.level.org.springframwork.security=debug
